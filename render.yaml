services:
  - type: web
    name: cybershield-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ACCESS_TOKEN_MINUTES
        value: 60
      - key: MAX_UPLOAD_MB
        value: 5
      - key: CORS_ORIGINS
        value: https://cybershield.vercel.app,http://localhost:5173
      - key: CORS_ORIGIN_REGEX
        value: ^https:\/\/.*\.vercel\.app$
